[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "your-project-name"
version = "0.1.0"
description = "A short description of what this project does."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    # Linting & formatting
    "ruff>=0.8.0",
    # Type checking
    "mypy>=1.11.0",
    "types-requests",
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
]

# ═══════════════════════════════════════════
# RUFF CONFIGURATION (Linter + Formatter)
# ═══════════════════════════════════════════

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    # Built-in rules: https://docs.astral.sh/ruff/rules/
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, etc.)
    "I",      # isort (import sorting)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (common bugs)
    "SIM",    # flake8-simplify (simplify code)
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RSE",    # flake8-raise
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # Line length handled by formatter
    "N999",   # Module names don't need to follow strict rules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ are intentional
"tests/**/*.py" = ["S101"]  # Use of assert in tests is OK

# ═══════════════════════════════════════════
# MYPI CONFIGURATION (Type Checking)
# ═══════════════════════════════════════════

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ═══════════════════════════════════════════
# PYTEST CONFIGURATION
# ═══════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",  # Minimum 70% coverage to pass CI
]

markers = [
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ═══════════════════════════════════════════
# COVERAGE CONFIGURATION
# ═══════════════════════════════════════════

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "setup.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
]
