name: Bug Report
description: File a bug report
title: "bug: <description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for taking the time to fill out this bug report!
        
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: "I was trying to do X, but Y happened instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      value: |
        1. Go to/Run '...'
        2. Click on or execute '...'
        3. Scroll down to/Observe '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this issue?
      options:
        - Critical (system unusable)
        - High (major feature broken)
        - Medium (minor feature affected)
        - Low (cosmetic/minor)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide relevant environment details.
      value: |
        - OS: [e.g., Ubuntu 24.04, macOS 15, Windows 11]
        - Python Version: [e.g., 3.12.4]
        - Browser: [if applicable, e.g., Chrome 128]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output. This will be automatically formatted as code.
      render: shell

  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate Declaration
      options:
        - label: I have searched the existing issues to confirm this is not a duplicate.
          required: true
