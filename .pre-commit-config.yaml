# Pre-commit Configuration
# Runs before every git commit to enforce quality standards
# Hook reference: https://pre-commit.com/hooks.html

repos:
  # ═══════════════════════════════════════════
  # PYTHON HOOKS (via ruff)
  # ═══════════════════════════════════════════
  
  # Ruff: Ultra-fast Python linter + auto-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: migrations|node_modules|__pycache__
      
      # Run the formatter (black-compatible)
      - id: ruff-format

  # ═══════════════════════════════════════════
  # JS/TS HOOKS
  # ═══════════════════════════════════════════
  
  # ESLint with TypeScript support
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: "\.(js|ts|jsx|tsx)$"
        additional_dependencies:
          - eslint@9.x
          - "@typescript-eslint/parser@^7.0.0"
          - "@typescript-eslint/eslint-plugin@^7.0.0"

  # Prettier for consistent formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.x
        args: [--write]

  # ═══════════════════════════════════════════
  # GENERAL / CROSS-PLATFORM HOOKS
  # ═══════════════════════════════════════════
  
  # Trim trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      
      # Ensure files end with newline
      - id: end-of-file-fixer
      
      # Check for accidentally added merge conflicts
      - id: check-merge-conflict
      
      # Don't commit giant files (>1MB)
      - id: check-added-large-files
        args: [--maxkb=1024]
      
      # Check JSON/YAML syntax validity
      - id: check-json
      
      - id: check-yaml
        args: [--allow-multiple-documents]
      
      # Detect accidentally added secrets (private keys)
      - id: detect-private-key

  # ═══════════════════════════════════════════
  # PROJECT-SPECIFIC HOOKS
  # ═══════════════════════════════════════════
  
  # Check Python syntax & imports
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-crlf
      
      # Auto-sort imports
      - id: forbid-crlf

  # ═══════════════════════════════════════════
  # CUSTOM HOOKS
  # ═══════════════════════════════════════════
  
  # Verify commit message format (Conventional Commits)
  - repo: https://github.com/conventional-changelog/commitlint
    rev: v19.5.0
    hooks:
      - id: commitlint
  
  # Run type checking on Python code
  - repo: local
    hooks:
      - id: mypy-check
        name: mypy type check
        entry: bash -c 'mypy .'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

# Settings
default_stages: [commit]
minimum_pre_commit_version: "3.5.0"
ci:
  autofix_prs: true
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
